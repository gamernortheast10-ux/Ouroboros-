<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rock Paper Scissors</title>
<script src="./ouro-wallet-bridge.js?v=8"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e14;--panel:#121820;--panel2:#1a222e;--border:rgba(255,255,255,0.07);--gold:#f0c14b;--green:#22c55e;--red:#ef4444;--text:#e8edf5;--muted:#7d8a9e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;user-select:none;overflow-x:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;background:linear-gradient(90deg,#f97316,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.bal-box{text-align:right}.bal-box .label{font-size:9px;color:var(--muted);text-transform:uppercase}
.bal-box .val{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--gold)}
.sound-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:14px;cursor:pointer}

.stage{margin:12px;background:var(--panel);border-radius:18px;border:1px solid var(--border);padding:24px 16px;text-align:center}
.vs-row{display:flex;justify-content:center;align-items:center;gap:20px;margin-bottom:16px}
.hand{width:100px;height:100px;border-radius:20px;background:var(--panel2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:48px;transition:transform 0.2s}
.hand.shake{animation:shake 0.4s ease}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
.vs{font-size:18px;font-weight:800;color:var(--muted)}
.streak-bar{display:flex;justify-content:space-between;padding:10px 14px;background:rgba(0,0,0,0.25);border-radius:10px}
.streak-bar .lab{font-size:12px;color:var(--muted)}
.streak-bar .val{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--gold)}
.result{margin-top:12px;font-weight:700;font-size:16px;min-height:24px}

.controls{padding:12px 14px 16px;background:var(--panel);border-top:1px solid var(--border);margin-top:auto}
.bet-row{display:flex;gap:10px;margin-bottom:10px}
.box{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.box label{font-size:10px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase}
.box input{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700}
.chips{display:flex;gap:6px;margin-bottom:12px}
.chip{flex:1;padding:8px 4px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted);text-align:center;cursor:pointer}
.chip.active{border-color:var(--gold);color:var(--gold)}
.choices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.choice{border:2px solid var(--border);border-radius:14px;padding:16px 8px;text-align:center;cursor:pointer;background:var(--panel2);font-size:32px}
.choice:active{transform:scale(0.95)}
.choice .label{font-size:11px;font-weight:600;color:var(--muted);margin-top:4px}
.btn-cash{width:100%;border:none;border-radius:14px;padding:14px;font-size:14px;font-weight:800;cursor:pointer;background:linear-gradient(180deg,#22c55e,#15803d);color:#04120a}
.btn-cash:disabled{opacity:0.4;cursor:not-allowed}
.info{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}

.toast{position:fixed;top:58px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--panel2);border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:100;opacity:0;transition:all 0.28s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.win{border-color:#22c55e;color:#4ade80}
.toast.lose{border-color:#ef4444;color:#f87171}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">RPS BATTLE</div>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
    <div class="bal-box"><div class="label">Balance</div><div class="val" id="balance">₹0.00</div></div>
  </div>
</div>

<div class="stage">
  <div class="streak-bar">
    <div><div class="lab">Streak</div><div class="val" id="streakVal">0</div></div>
    <div style="text-align:right"><div class="lab">Multiplier</div><div class="val" id="multVal">1.00x</div></div>
  </div>
  <div class="vs-row" style="margin-top:16px">
    <div class="hand" id="playerHand">❓</div>
    <div class="vs">VS</div>
    <div class="hand" id="cpuHand">❓</div>
  </div>
  <div class="result" id="result">Pick Rock, Paper or Scissors</div>
</div>

<div class="controls">
  <div class="bet-row">
    <div class="box"><label>Bet Amount</label><input type="number" id="betAmt" value="100" min="10" step="10"></div>
  </div>
  <div class="chips">
    <div class="chip" onclick="setBet(50,this)">₹50</div>
    <div class="chip active" onclick="setBet(100,this)">₹100</div>
    <div class="chip" onclick="setBet(250,this)">₹250</div>
    <div class="chip" onclick="setBet(500,this)">₹500</div>
  </div>
  <div class="choices">
    <div class="choice" onclick="play('rock')">✊<div class="label">ROCK</div></div>
    <div class="choice" onclick="play('paper')">✋<div class="label">PAPER</div></div>
    <div class="choice" onclick="play('scissors')">✌️<div class="label">SCISSORS</div></div>
  </div>
  <button class="btn-cash" id="btnCash" onclick="cashOut()" disabled>CASH OUT STREAK</button>
  <div class="info">Win = streak up · Lose = reset · 1.80x per win · Max 10 streak</div>
</div>
<div class="toast" id="toast"></div>

<script>
const EMOJI={rock:'✊',paper:'✋',scissors:'✌️'};
const BEATS={rock:'scissors',paper:'rock',scissors:'paper'};
const HOUSE_LOSS_PROB=0.25;
const STREAK_BASE=1.80;
const MAX_STREAK=10;

let balance=window.OuroBridge?window.OuroBridge.getBalance():0,soundOn=true,streak=0,currentMult=1,betAmount=0,phase='idle',busy=false,audioCtx=null;

function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext);if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(f,d,t='sine',v=0.08,w=0){if(!soundOn)return;ensureAudio();const t0=audioCtx.currentTime+w;const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type=t;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(audioCtx.destination);o.start(t0);o.stop(t0+d+0.02)}
function playHit(){if(window.OuroBridge&&window.OuroBridge.fx){window.OuroBridge.fx.play('step');return;}tone(250,0.06,'square',0.05)}
function playWin(){if(window.OuroBridge&&window.OuroBridge.fx){window.OuroBridge.fx.play('win');window.OuroBridge.fx.showWin(Math.round(betAmount*currentMult*100)/100,'RPS Streak '+streak);return;}tone(520,0.08,'sine',0.07);tone(780,0.1,'sine',0.05,0.06)}
function playLose(){if(window.OuroBridge&&typeof window.OuroBridge.loss==='function'){window.OuroBridge.loss(betAmount,'CPU Wins Round');return;}tone(150,0.12,'triangle',0.05);tone(100,0.18,'triangle',0.04,0.1)}
function playCash(){if(window.OuroBridge&&window.OuroBridge.fx)return;[523,659,784].forEach((f,i)=>tone(f,0.13,'sine',0.08,i*0.07))}
function toggleSound(){soundOn=!soundOn;if(window.OuroBridge&&window.OuroBridge.setMuted)window.OuroBridge.setMuted(!soundOn);document.getElementById('soundBtn').textContent=soundOn?'🔊':'🔇';if(soundOn&&window.OuroBridge&&window.OuroBridge.fx)window.OuroBridge.fx.play('bet');else if(soundOn)tone(600,0.07)}
function fmt(n){return n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function updateBal(){document.getElementById('balance').textContent='₹'+fmt(balance)}
function showToast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(type?' '+type:'');setTimeout(()=>t.classList.remove('show'),2000)}
function setBet(v,el){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));if(el)el.classList.add('active');document.getElementById('betAmt').value=v}

function play(player){
  if(busy)return;
  if(phase==='idle'){
    const amt=+document.getElementById('betAmt').value;
    if(!amt||amt<10)return showToast('Min bet ₹10');
    if(window.OuroBridge?!window.OuroBridge.canAfford(amt):amt>balance){
      showToast('Insufficient balance — Top Up','lose');
      if(window.OuroBridge)window.OuroBridge.openTopUp();
      return;
    }
    if(window.OuroBridge){
      if(!window.OuroBridge.bet(amt,'RPS Battle')){window.OuroBridge.openTopUp();return;}
      balance=window.OuroBridge.getBalance();
    } else {
      balance-=amt;
    }
    updateBal();
    betAmount=amt;streak=0;currentMult=1;
  }
  busy=true;
  document.getElementById('btnCash').disabled=true;

  const pHand=document.getElementById('playerHand');
  const cHand=document.getElementById('cpuHand');
  pHand.classList.add('shake');cHand.classList.add('shake');
  pHand.textContent='❓';cHand.textContent='❓';
  playHit();

  let cpu;
  const roll=Math.random();
  if(roll<HOUSE_LOSS_PROB){
    cpu=Object.keys(BEATS).find(k=>BEATS[k]===player) || 'rock';
  } else {
    cpu=['rock','paper','scissors'][Math.floor(Math.random()*3)];
  }

  setTimeout(()=>{
    pHand.classList.remove('shake');cHand.classList.remove('shake');
    pHand.textContent=EMOJI[player];
    cHand.textContent=EMOJI[cpu];

    let outcome;
    if(player===cpu) outcome='draw';
    else if(BEATS[player]===cpu) outcome='win';
    else outcome='lose';

    if(outcome==='win'){
      streak=Math.min(MAX_STREAK,streak+1);
      currentMult=+(Math.pow(STREAK_BASE,streak)).toFixed(2);
      document.getElementById('streakVal').textContent=streak;
      document.getElementById('multVal').textContent=currentMult.toFixed(2)+'x';
      document.getElementById('result').textContent='You win!';
      document.getElementById('result').style.color='#4ade80';
      document.getElementById('btnCash').disabled=false;
      playWin();
      phase='streak';
      if(streak>=MAX_STREAK){
        busy=false;
        cashOut();
        return;
      }
      showToast('Win · Streak '+streak+' · '+currentMult.toFixed(2)+'x','win');
    } else if(outcome==='draw'){
      document.getElementById('result').textContent='Draw · try again';
      document.getElementById('result').style.color='var(--muted)';
      if(streak>0) document.getElementById('btnCash').disabled=false;
      phase=streak>0?'streak':'idle';
      tone(300,0.08,'sine',0.05);
    } else {
      document.getElementById('result').textContent='You lose!';
      document.getElementById('result').style.color='#f87171';
      playLose();
      showToast('Lost · -₹'+fmt(betAmount),'lose');
      phase='idle';streak=0;currentMult=1;
      document.getElementById('streakVal').textContent='0';
      document.getElementById('multVal').textContent='1.00x';
      document.getElementById('btnCash').disabled=true;
    }
    busy=false;
  },500);
}

function cashOut(){
  if(phase!=='streak'||streak===0)return;
  const payout=Math.round(betAmount*currentMult*100)/100;
  const profit=payout-betAmount;
  if(window.OuroBridge&&payout>0){
    window.OuroBridge.win(payout,'RPS Battle Cashout');
    balance=window.OuroBridge.getBalance();
  } else {
    balance+=payout;
  }
  updateBal();
  playCash();
  showToast('Cashed @ '+currentMult.toFixed(2)+'x · +₹'+fmt(profit),'win');
  phase='idle';streak=0;currentMult=1;
  document.getElementById('streakVal').textContent='0';
  document.getElementById('multVal').textContent='1.00x';
  document.getElementById('btnCash').disabled=true;
  document.getElementById('result').textContent='Cashed out!';
}

if(window.OuroBridge){
  balance=window.OuroBridge.init({
    gameId:'rps',
    gameTitle:'RPS Battle',
    onBalanceChange:(bal)=>{balance=bal;updateBal();},
    onDenied:(msg)=>showToast(msg,'lose'),
  });
}
updateBal();
</script>
</body>
</html>
