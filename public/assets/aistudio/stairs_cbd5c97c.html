<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stairs · Climb</title>
<script src="./ouro-wallet-bridge.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b12;--panel:#0f1520;--panel2:#161e2c;--border:rgba(255,255,255,0.07);--gold:#f0c14b;--green:#22c55e;--red:#ef4444;--text:#e8edf5;--muted:#7d8a9e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;user-select:none;overflow-x:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;background:linear-gradient(90deg,#a78bfa,#f0c14b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.bal-box{text-align:right}.bal-box .label{font-size:9px;color:var(--muted);text-transform:uppercase}
.bal-box .val{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--gold)}
.sound-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:14px;cursor:pointer}

.stairs{margin:12px;background:var(--panel);border-radius:16px;border:1px solid var(--border);padding:12px;max-height:360px;overflow-y:auto}
.step{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--border)}
.step:last-child{border-bottom:none}
.step-num{width:28px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.step-bar{flex:1;height:36px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden}
.step-bar:active{transform:scale(0.98)}
.step-bar.safe{background:linear-gradient(90deg,#166534,#14532d);border-color:#22c55e;color:#4ade80}
.step-bar.dead{background:linear-gradient(90deg,#7f1d1d,#450a0a);border-color:#ef4444;color:#f87171}
.step-bar.locked{opacity:0.35;pointer-events:none}
.step-bar.current{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.step-mult{width:52px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--gold);text-align:right}

.hud{display:flex;justify-content:space-between;padding:8px 14px;font-size:13px}
.hud span{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--gold)}

.controls{padding:12px 14px 16px;background:var(--panel);border-top:1px solid var(--border);margin-top:auto}
.row{display:flex;gap:10px;margin-bottom:10px}
.box{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.box label{font-size:10px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase}
.box input{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700}
.chips{display:flex;gap:6px;margin-bottom:12px}
.chip{flex:1;padding:8px 4px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted);text-align:center;cursor:pointer}
.chip.active{border-color:var(--gold);color:var(--gold)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:none;border-radius:14px;padding:15px 8px;font-size:15px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-start{background:linear-gradient(180deg,#a78bfa,#7c3aed);color:#fff;box-shadow:0 4px 16px rgba(167,139,250,0.35)}
.btn-cash{background:linear-gradient(180deg,#22c55e,#15803d);color:#04120a;box-shadow:0 4px 16px rgba(34,197,94,0.35)}
.btn small{font-size:10px;font-weight:500;opacity:0.85}

.toast{position:fixed;top:58px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--panel2);border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:100;opacity:0;transition:all 0.28s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.win{border-color:#22c55e;color:#4ade80}
.toast.lose{border-color:#ef4444;color:#f87171}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">STAIRS</div>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
    <div class="bal-box"><div class="label">Balance</div><div class="val" id="balance">₹0.00</div></div>
  </div>
</div>

<div class="hud">
  <div>Step <span id="stepVal">0</span>/12</div>
  <div>Multiplier <span id="multVal">1.00x</span></div>
</div>

<div class="stairs" id="stairs"></div>

<div class="controls">
  <div class="row">
    <div class="box"><label>Bet Amount</label><input type="number" id="betAmt" value="100" min="10" step="10"></div>
  </div>
  <div class="chips">
    <div class="chip" onclick="setBet(50,this)">₹50</div>
    <div class="chip active" onclick="setBet(100,this)">₹100</div>
    <div class="chip" onclick="setBet(250,this)">₹250</div>
    <div class="chip" onclick="setBet(500,this)">₹500</div>
  </div>
  <div class="actions">
    <button class="btn btn-start" id="btnStart" onclick="startGame()">START<small>Climb stairs</small></button>
    <button class="btn btn-cash" id="btnCash" onclick="cashOut()" disabled>CASH OUT<small id="cashHint">—</small></button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const STEPS=12;
const MIN_CASHOUT_STEP=5;
// Risk increases: 0.90 -> 0.35
const CHANCE=[0.90,0.85,0.80,0.75,0.70,0.65,0.60,0.55,0.50,0.45,0.40,0.35];
const MULTS=[1.10,1.20,1.45,1.95,2.80,4.30,7.10,12.80,25.50,56.00,138.00,390.00];

let balance=window.OuroBridge?window.OuroBridge.getBalance():0,soundOn=true,phase='idle',step=0,currentMult=1,betAmount=0,audioCtx=null;

function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext);if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(f,d,t='sine',v=0.08,w=0){if(!soundOn)return;ensureAudio();const t0=audioCtx.currentTime+w;const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type=t;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(audioCtx.destination);o.start(t0);o.stop(t0+d+0.02)}
function playSafe(){tone(480,0.07,'sine',0.06);tone(720,0.08,'sine',0.04,0.05)}
function playFall(){tone(100,0.2,'sawtooth',0.1);tone(50,0.3,'triangle',0.07,0.1)}
function playCash(){[523,659,784,1046].forEach((f,i)=>tone(f,0.13,'sine',0.08,i*0.07))}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').textContent=soundOn?'🔊':'🔇';if(soundOn)tone(600,0.07)}
function fmt(n){return n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function updateBal(){document.getElementById('balance').textContent='₹'+fmt(balance)}
function showToast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(type?' '+type:'');setTimeout(()=>t.classList.remove('show'),2000)}
function setBet(v,el){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));if(el)el.classList.add('active');document.getElementById('betAmt').value=v}

function buildStairs(){
  const box=document.getElementById('stairs');
  box.innerHTML='';
  for(let i=STEPS-1;i>=0;i--){
    const row=document.createElement('div');
    row.className='step';
    row.innerHTML='<div class="step-num">'+(i+1)+'</div><div class="step-bar locked" id="bar'+i+'" onclick="climb('+i+')">?</div><div class="step-mult">'+MULTS[i].toFixed(2)+'x</div>';
    box.appendChild(row);
  }
}

function startGame(){
  if(phase==='playing')return;
  const amt=+document.getElementById('betAmt').value;
  if(!amt||amt<10)return showToast('Min bet ₹10');
  if(window.OuroBridge?!window.OuroBridge.canAfford(amt):amt>balance){
    showToast('Insufficient balance — Top Up','lose');
    if(window.OuroBridge)window.OuroBridge.openTopUp();
    return;
  }
  if(window.OuroBridge){
    if(!window.OuroBridge.bet(amt,'Stairs Climb')){window.OuroBridge.openTopUp();return;}
    balance=window.OuroBridge.getBalance();
  } else {
    balance-=amt;
  }
  updateBal();
  betAmount=amt;step=0;currentMult=1;phase='playing';
  buildStairs();
  document.getElementById('bar0').classList.remove('locked');
  document.getElementById('bar0').classList.add('current');
  document.getElementById('bar0').textContent='CLIMB';
  document.getElementById('btnStart').disabled=true;
  document.getElementById('btnCash').disabled=true;
  document.getElementById('stepVal').textContent='0';
  document.getElementById('multVal').textContent='1.00x';
  document.getElementById('cashHint').textContent='Reach Step '+MIN_CASHOUT_STEP;
  tone(400,0.08,'square',0.05);
}

function climb(s){
  if(phase!=='playing'||s!==step)return;
  const bar=document.getElementById('bar'+s);
  const success=Math.random()<CHANCE[s];

  if(success){
    bar.classList.remove('current');
    bar.classList.add('safe');
    bar.textContent='✓ SAFE';
    step++;
    currentMult=MULTS[s];
    document.getElementById('stepVal').textContent=step;
    document.getElementById('multVal').textContent=currentMult.toFixed(2)+'x';
    const unlocked=step>=MIN_CASHOUT_STEP;
    document.getElementById('btnCash').disabled=!unlocked;
    document.getElementById('cashHint').textContent=unlocked?('₹'+fmt(betAmount*currentMult)):('Step '+step+'/'+MIN_CASHOUT_STEP+' req.');
    playSafe();
    if(step>=STEPS){cashOut();return}
    const next=document.getElementById('bar'+step);
    next.classList.remove('locked');
    next.classList.add('current');
    next.textContent='CLIMB';
  } else {
    bar.classList.remove('current');
    bar.classList.add('dead');
    bar.textContent='✗ FALL';
    phase='dead';
    playFall();
    document.getElementById('btnStart').disabled=false;
    document.getElementById('btnCash').disabled=true;
    document.getElementById('cashHint').textContent='—';
    showToast('Fell! -₹'+fmt(betAmount),'lose');
  }
}

function cashOut(){
  if(phase!=='playing'||step<MIN_CASHOUT_STEP)return;
  const payout=Math.round(betAmount*currentMult*100)/100;
  const profit=payout-betAmount;
  if(window.OuroBridge&&payout>0){
    window.OuroBridge.win(payout,'Stairs Climb Cashout');
    balance=window.OuroBridge.getBalance();
  } else {
    balance+=payout;
  }
  updateBal();
  phase='idle';
  playCash();
  document.getElementById('btnStart').disabled=false;
  document.getElementById('btnCash').disabled=true;
  document.getElementById('cashHint').textContent='—';
  const cur=document.querySelector('.step-bar.current');
  if(cur){cur.classList.remove('current');cur.classList.add('locked')}
  showToast('Cashed @ '+currentMult.toFixed(2)+'x · +₹'+fmt(profit),'win');
}

if(window.OuroBridge){
  balance=window.OuroBridge.init({
    gameId:'stairs',
    gameTitle:'Stairs Climb',
    onBalanceChange:(bal)=>{balance=bal;updateBal();},
    onDenied:(msg)=>showToast(msg,'lose'),
  });
}
buildStairs();updateBal();
</script>
</body>
</html>
