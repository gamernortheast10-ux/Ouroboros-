<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coin Flip</title>
<script src="./ouro-wallet-bridge.js?v=8"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e14;--panel:#121820;--panel2:#1a222e;--border:rgba(255,255,255,0.07);--gold:#f0c14b;--green:#22c55e;--red:#ef4444;--text:#e8edf5;--muted:#7d8a9e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;user-select:none;overflow-x:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;background:linear-gradient(90deg,#f0c14b,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.bal-box{text-align:right}.bal-box .label{font-size:9px;color:var(--muted);text-transform:uppercase}
.bal-box .val{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--gold)}
.sound-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:14px;cursor:pointer}

.stage{margin:16px 12px;background:var(--panel);border-radius:18px;border:1px solid var(--border);padding:28px 16px;text-align:center;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.coin{width:120px;height:120px;border-radius:50%;position:relative;transform-style:preserve-3d;transition:transform 0.1s}
.coin.flip{animation:coinFlip 1.2s ease-in-out}
@keyframes coinFlip{
  0%{transform:rotateY(0) scale(1)}
  50%{transform:rotateY(900deg) scale(1.15)}
  100%{transform:rotateY(1800deg) scale(1)}
}
.coin-face{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;backface-visibility:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.coin-heads{background:linear-gradient(145deg,#f0c14b,#d97706);color:#1a0a00}
.coin-tails{background:linear-gradient(145deg,#3b82f6,#1d4ed8);color:#fff;transform:rotateY(180deg)}
.streak{margin-top:18px;font-size:14px;color:var(--muted)}
.streak strong{color:var(--gold);font-family:'JetBrains Mono',monospace;font-size:20px}
.result{margin-top:8px;font-weight:700;font-size:16px;min-height:24px}

.controls{padding:12px 14px 16px;background:var(--panel);border-top:1px solid var(--border);margin-top:auto}
.bet-row{display:flex;gap:10px;margin-bottom:10px}
.box{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.box label{font-size:10px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase}
.box input{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700}
.chips{display:flex;gap:6px;margin-bottom:12px}
.chip{flex:1;padding:8px 4px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted);text-align:center;cursor:pointer}
.chip.active{border-color:var(--gold);color:var(--gold)}
.side-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.side-btn{border:2px solid var(--border);border-radius:14px;padding:16px;font-size:15px;font-weight:800;cursor:pointer;background:var(--panel2);text-align:center}
.side-btn.heads.active{border-color:#f0c14b;background:rgba(240,193,75,0.12);color:#f0c14b}
.side-btn.tails.active{border-color:#3b82f6;background:rgba(59,130,246,0.12);color:#60a5fa}
.side-btn .pay{font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.btn-flip{width:100%;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(180deg,#f0c14b,#d97706);color:#1a0a00;box-shadow:0 4px 18px rgba(240,193,75,0.35)}
.btn-flip:disabled{opacity:0.45;cursor:not-allowed}
.btn-cash{width:100%;margin-top:8px;border:none;border-radius:14px;padding:14px;font-size:14px;font-weight:800;cursor:pointer;background:linear-gradient(180deg,#22c55e,#15803d);color:#04120a}
.btn-cash:disabled{opacity:0.4;cursor:not-allowed}

.toast{position:fixed;top:58px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--panel2);border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:100;opacity:0;transition:all 0.28s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.win{border-color:#22c55e;color:#4ade80}
.toast.lose{border-color:#ef4444;color:#f87171}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">COIN FLIP</div>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
    <div class="bal-box"><div class="label">Balance</div><div class="val" id="balance">₹0.00</div></div>
  </div>
</div>

<div class="stage">
  <div class="coin" id="coin">
    <div class="coin-face coin-heads">H</div>
    <div class="coin-face coin-tails">T</div>
  </div>
  <div class="streak">Streak <strong id="streakVal">0</strong> · Mult <strong id="multVal">1.00x</strong></div>
  <div class="result" id="result"></div>
</div>

<div class="controls">
  <div class="bet-row">
    <div class="box"><label>Bet Amount</label><input type="number" id="betAmt" value="100" min="10" step="10"></div>
  </div>
  <div class="chips">
    <div class="chip" onclick="setBet(50,this)">₹50</div>
    <div class="chip active" onclick="setBet(100,this)">₹100</div>
    <div class="chip" onclick="setBet(250,this)">₹250</div>
    <div class="chip" onclick="setBet(500,this)">₹500</div>
  </div>
  <div class="side-btns">
    <div class="side-btn heads active" id="btnHeads" onclick="selectSide('heads')">HEADS<div class="pay">1.96x</div></div>
    <div class="side-btn tails" id="btnTails" onclick="selectSide('tails')">TAILS<div class="pay">1.96x</div></div>
  </div>
  <button class="btn-flip" id="btnFlip" onclick="flip()">FLIP</button>
  <button class="btn-cash" id="btnCash" onclick="cashOut()" disabled>CASH OUT STREAK</button>
</div>
<div class="toast" id="toast"></div>

<script>
let balance=window.OuroBridge?window.OuroBridge.getBalance():0,soundOn=true,side='heads',streak=0,currentMult=1,betAmount=0,phase='idle',audioCtx=null;
// 49% win chance → slight house edge (fair would be 50%)
const WIN_P=0.49;
const MAX_STREAK=10;

function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext);if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(f,d,t='sine',v=0.08,w=0){if(!soundOn)return;ensureAudio();const t0=audioCtx.currentTime+w;const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type=t;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(audioCtx.destination);o.start(t0);o.stop(t0+d+0.02)}
function playFlip(){if(window.OuroBridge&&window.OuroBridge.fx){for(let i=0;i<5;i++)setTimeout(()=>window.OuroBridge.fx.play('step',{pitchStep:i}),i*150);return;}for(let i=0;i<8;i++)tone(200+Math.random()*150,0.04,'square',0.03,i*0.06)}
function playWin(){if(window.OuroBridge&&window.OuroBridge.fx){window.OuroBridge.fx.play('win');window.OuroBridge.fx.showWin(Math.round(betAmount*currentMult*100)/100,'Streak '+streak+' · '+currentMult.toFixed(2)+'x');return;}tone(520,0.08,'sine',0.07);tone(780,0.1,'sine',0.05,0.06)}
function playLose(){if(window.OuroBridge&&typeof window.OuroBridge.loss==='function'){window.OuroBridge.loss(betAmount,'Wrong Side · '+outcomeFaceLabel());return;}tone(150,0.12,'triangle',0.05);tone(100,0.18,'triangle',0.04,0.1)}
function outcomeFaceLabel(){return side==='heads'?'TAILS':'HEADS';}
function playCash(){if(window.OuroBridge&&window.OuroBridge.fx)return;[523,659,784].forEach((f,i)=>tone(f,0.13,'sine',0.08,i*0.07))}
function toggleSound(){soundOn=!soundOn;if(window.OuroBridge&&window.OuroBridge.setMuted)window.OuroBridge.setMuted(!soundOn);document.getElementById('soundBtn').textContent=soundOn?'🔊':'🔇';if(soundOn&&window.OuroBridge&&window.OuroBridge.fx)window.OuroBridge.fx.play('bet');else if(soundOn)tone(600,0.07)}
function fmt(n){return n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function updateBal(){document.getElementById('balance').textContent='₹'+fmt(balance)}
function showToast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(type?' '+type:'');setTimeout(()=>t.classList.remove('show'),2000)}
function setBet(v,el){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));if(el)el.classList.add('active');document.getElementById('betAmt').value=v}
function selectSide(s){side=s;document.getElementById('btnHeads').classList.toggle('active',s==='heads');document.getElementById('btnTails').classList.toggle('active',s==='tails')}

function flip(){
  if(phase==='flipping')return;
  const amt=+document.getElementById('betAmt').value;
  if(phase==='idle'){
    if(!amt||amt<10)return showToast('Min bet ₹10');
    if(window.OuroBridge?!window.OuroBridge.canAfford(amt):amt>balance){
      showToast('Insufficient balance — Top Up','lose');
      if(window.OuroBridge)window.OuroBridge.openTopUp();
      return;
    }
    if(window.OuroBridge){
      if(!window.OuroBridge.bet(amt,'Coin Flip')){window.OuroBridge.openTopUp();return;}
      balance=window.OuroBridge.getBalance();
    } else {
      balance-=amt;
    }
    updateBal();betAmount=amt;streak=0;currentMult=1;
  }
  phase='flipping';
  document.getElementById('btnFlip').disabled=true;
  document.getElementById('btnCash').disabled=true;
  document.getElementById('result').textContent='';

  const coin=document.getElementById('coin');
  coin.classList.remove('flip');
  void coin.offsetWidth;
  coin.classList.add('flip');
  playFlip();

  const win=Math.random()<WIN_P;
  const outcome=win?side:(side==='heads'?'tails':'heads');

  setTimeout(()=>{
    // final face
    coin.style.transform=outcome==='heads'?'rotateY(0)':'rotateY(180deg)';
    coin.classList.remove('flip');

    if(win){
      streak++;
      currentMult=+(Math.pow(1.96,streak)).toFixed(2);
      document.getElementById('streakVal').textContent=streak;
      document.getElementById('multVal').textContent=currentMult.toFixed(2)+'x';
      document.getElementById('result').textContent='Correct!';
      document.getElementById('result').style.color='#4ade80';
      document.getElementById('btnCash').disabled=false;
      phase='streak';
      document.getElementById('btnFlip').disabled=false;
      if(streak>=MAX_STREAK){
        showToast('Max Streak '+MAX_STREAK+'! Auto Cashout','win');
        cashOut();
        return;
      }
      playWin();
      showToast('Streak '+streak+' · '+currentMult.toFixed(2)+'x','win');
      document.getElementById('btnFlip').textContent='DOUBLE OR NOTHING';
    } else {
      document.getElementById('result').textContent='Wrong!';
      document.getElementById('result').style.color='#f87171';
      playLose();
      showToast('Lost · -₹'+fmt(betAmount),'lose');
      phase='idle';
      streak=0;currentMult=1;
      document.getElementById('streakVal').textContent='0';
      document.getElementById('multVal').textContent='1.00x';
      document.getElementById('btnFlip').disabled=false;
      document.getElementById('btnFlip').textContent='FLIP';
      document.getElementById('btnCash').disabled=true;
    }
  },1250);
}

function cashOut(){
  if(phase!=='streak'||streak===0)return;
  const payout=Math.round(betAmount*currentMult*100)/100;
  const profit=payout-betAmount;
  if(window.OuroBridge&&payout>0){
    window.OuroBridge.win(payout,'Coin Flip Cashout');
    balance=window.OuroBridge.getBalance();
  } else {
    balance+=payout;
  }
  updateBal();
  playCash();
  showToast('Cashed @ '+currentMult.toFixed(2)+'x · +₹'+fmt(profit),'win');
  phase='idle';streak=0;currentMult=1;
  document.getElementById('streakVal').textContent='0';
  document.getElementById('multVal').textContent='1.00x';
  document.getElementById('btnFlip').textContent='FLIP';
  document.getElementById('btnCash').disabled=true;
  document.getElementById('result').textContent='';
}

if(window.OuroBridge){
  balance=window.OuroBridge.init({
    gameId:'coinflip',
    gameTitle:'Coin Flip',
    onBalanceChange:(bal)=>{balance=bal;updateBal();},
    onDenied:(msg)=>showToast(msg,'lose'),
  });
}
updateBal();
</script>
</body>
</html>
