<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Treasure Boxes</title>
<script src="./ouro-wallet-bridge.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a08;--panel:#16120e;--panel2:#1f1a14;--border:rgba(255,255,255,0.07);--gold:#f0c14b;--green:#22c55e;--red:#ef4444;--text:#e8edf5;--muted:#9a8b7a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;user-select:none;overflow-x:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;background:linear-gradient(90deg,#f0c14b,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.bal-box{text-align:right}.bal-box .label{font-size:9px;color:var(--muted);text-transform:uppercase}
.bal-box .val{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--gold)}
.sound-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:14px;cursor:pointer}

.hud{display:flex;justify-content:space-between;padding:10px 14px;font-size:13px}
.hud span{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--gold)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px 16px}
.box-item{
  aspect-ratio:1;border-radius:16px;background:linear-gradient(145deg,#2a2118,#1a150f);
  border:2px solid rgba(240,193,75,0.25);display:flex;align-items:center;justify-content:center;
  font-size:36px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
}
.box-item:active{transform:scale(0.95)}
.box-item.opened{pointer-events:none}
.box-item.gem{border-color:#22c55e;background:linear-gradient(145deg,#14532d,#0a2e16);animation:pop 0.3s ease}
.box-item.bomb{border-color:#ef4444;background:linear-gradient(145deg,#7f1d1d,#450a0a);animation:shake 0.4s ease}
.box-item.locked{opacity:0.4;pointer-events:none}
@keyframes pop{0%{transform:scale(0.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.controls{padding:12px 14px 16px;background:var(--panel);border-top:1px solid var(--border);margin-top:auto}
.row{display:flex;gap:10px;margin-bottom:10px}
.box{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.box label{font-size:10px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase}
.box input,.box select{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700}
.box select{color:var(--gold)}
.chips{display:flex;gap:6px;margin-bottom:12px}
.chip{flex:1;padding:8px 4px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted);text-align:center;cursor:pointer}
.chip.active{border-color:var(--gold);color:var(--gold)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:none;border-radius:14px;padding:15px 8px;font-size:15px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-start{background:linear-gradient(180deg,#f0c14b,#d97706);color:#1a0a00;box-shadow:0 4px 16px rgba(240,193,75,0.35)}
.btn-cash{background:linear-gradient(180deg,#22c55e,#15803d);color:#04120a;box-shadow:0 4px 16px rgba(34,197,94,0.35)}
.btn small{font-size:10px;font-weight:500;opacity:0.85}

.toast{position:fixed;top:58px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--panel2);border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:100;opacity:0;transition:all 0.28s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.win{border-color:#22c55e;color:#4ade80}
.toast.lose{border-color:#ef4444;color:#f87171}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">TREASURE</div>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
    <div class="bal-box"><div class="label">Balance</div><div class="val" id="balance">₹0.00</div></div>
  </div>
</div>

<div class="hud">
  <div>Opened <span id="openedVal">0</span></div>
  <div>Multiplier <span id="multVal">1.00x</span></div>
</div>

<div class="grid" id="grid"></div>

<div class="controls">
  <div class="row">
    <div class="box"><label>Bet Amount</label><input type="number" id="betAmt" value="100" min="10" step="10"></div>
    <div class="box"><label>Bombs</label>
      <select id="bombs" onchange="if(phase==='idle')buildGrid()">
        <option value="2" selected>2 Bombs</option>
        <option value="3">3 Bombs</option>
        <option value="4">4 Bombs</option>
      </select>
    </div>
  </div>
  <div class="chips">
    <div class="chip" onclick="setBet(50,this)">₹50</div>
    <div class="chip active" onclick="setBet(100,this)">₹100</div>
    <div class="chip" onclick="setBet(250,this)">₹250</div>
    <div class="chip" onclick="setBet(500,this)">₹500</div>
  </div>
  <div class="actions">
    <button class="btn btn-start" id="btnStart" onclick="startGame()">START<small>Open boxes</small></button>
    <button class="btn btn-cash" id="btnCash" onclick="cashOut()" disabled>CASH OUT<small id="cashHint">—</small></button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SIZE=6;
const TREASURE_RTP=0.91;
const EARLY_PENALTY_RATE=0.05;
let balance=window.OuroBridge?window.OuroBridge.getBalance():0,soundOn=true,phase='idle',opened=0,currentMult=1,betAmount=0,bombs=[],audioCtx=null;

function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext);if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(f,d,t='sine',v=0.08,w=0){if(!soundOn)return;ensureAudio();const t0=audioCtx.currentTime+w;const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type=t;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(audioCtx.destination);o.start(t0);o.stop(t0+d+0.02)}
function playGem(){tone(520,0.08,'sine',0.07);tone(780,0.1,'sine',0.05,0.05)}
function playBomb(){tone(100,0.2,'sawtooth',0.1);tone(50,0.3,'triangle',0.07,0.1)}
function playCash(){[523,659,784,1046].forEach((f,i)=>tone(f,0.13,'sine',0.08,i*0.07))}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').textContent=soundOn?'🔊':'🔇';if(soundOn)tone(600,0.07)}
function fmt(n){return n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function updateBal(){document.getElementById('balance').textContent='₹'+fmt(balance)}
function showToast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(type?' '+type:'');setTimeout(()=>t.classList.remove('show'),2000)}
function setBet(v,el){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));if(el)el.classList.add('active');document.getElementById('betAmt').value=v}

function calcMult(openedCount,bombCount){
  const safe=SIZE-bombCount;
  if(openedCount<=0)return 1;
  let prob=1;
  for(let i=0;i<Math.min(openedCount,safe);i++){
    prob*=(safe-i)/(SIZE-i);
  }
  return Math.max(1.05,Math.floor((TREASURE_RTP/prob)*100)/100);
}

function calcNetPayout(openedCount){
  const safe=SIZE-bombs.length;
  const fullClear=openedCount>=safe;
  const early=openedCount>0&&openedCount<3&&!fullClear;
  const gross=Math.round(betAmount*currentMult*100)/100;
  const penalty=early?Math.round(betAmount*EARLY_PENALTY_RATE*100)/100:0;
  return{payout:Math.max(0,Math.round((gross-penalty)*100)/100),early,penalty};
}

function buildGrid(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  for(let i=0;i<SIZE;i++){
    const el=document.createElement('div');
    el.className='box-item locked';
    el.dataset.idx=i;
    el.textContent='📦';
    el.onclick=()=>openBox(i);
    grid.appendChild(el);
  }
  document.getElementById('openedVal').textContent='0';
  document.getElementById('multVal').textContent='1.00x';
}

function startGame(){
  if(phase==='playing')return;
  const amt=+document.getElementById('betAmt').value;
  if(!amt||amt<10)return showToast('Min bet ₹10');
  if(window.OuroBridge?!window.OuroBridge.canAfford(amt):amt>balance){
    showToast('Insufficient balance — Top Up','lose');
    if(window.OuroBridge)window.OuroBridge.openTopUp();
    return;
  }
  if(window.OuroBridge){
    if(!window.OuroBridge.bet(amt,'Treasure Boxes')){window.OuroBridge.openTopUp();return;}
    balance=window.OuroBridge.getBalance();
  } else {
    balance-=amt;
  }
  updateBal();
  betAmount=amt;opened=0;currentMult=1;phase='playing';
  const bombCount=+document.getElementById('bombs').value;
  bombs=[];
  while(bombs.length<bombCount){
    const r=Math.floor(Math.random()*SIZE);
    if(!bombs.includes(r))bombs.push(r);
  }
  buildGrid();
  document.querySelectorAll('.box-item').forEach(el=>el.classList.remove('locked'));
  document.getElementById('btnStart').disabled=true;
  document.getElementById('btnCash').disabled=true;
  document.getElementById('bombs').disabled=true;
  document.getElementById('cashHint').textContent='—';
  tone(400,0.08,'square',0.05);
}

function openBox(idx){
  if(phase!=='playing')return;
  const el=document.querySelector('[data-idx="'+idx+'"]');
  if(el.classList.contains('opened'))return;
  el.classList.add('opened');

  if(bombs.includes(idx)){
    el.classList.add('bomb');
    el.textContent='💣';
    phase='dead';
    playBomb();
    document.querySelectorAll('.box-item').forEach((b,i)=>{
      if(!b.classList.contains('opened')){
        b.classList.add('opened');
        if(bombs.includes(i)){b.classList.add('bomb');b.textContent='💣'}
        else{b.classList.add('gem');b.textContent='💎'}
      }
    });
    document.getElementById('btnStart').disabled=false;
    document.getElementById('btnCash').disabled=true;
    document.getElementById('bombs').disabled=false;
    document.getElementById('cashHint').textContent='—';
    showToast('Bomb! -₹'+fmt(betAmount),'lose');
    return;
  }

  opened++;
  currentMult=calcMult(opened,bombs.length);
  const preview=calcNetPayout(opened);
  el.classList.add('gem');
  el.textContent='💎';
  document.getElementById('openedVal').textContent=opened;
  document.getElementById('multVal').textContent=currentMult.toFixed(2)+'x';
  document.getElementById('btnCash').disabled=false;
  document.getElementById('cashHint').textContent='₹'+fmt(preview.payout)+(preview.early?' (-5% early)':'');
  playGem();

  if(opened>=SIZE-bombs.length) cashOut();
}

function cashOut(){
  if(phase!=='playing'||opened===0)return;
  const res=calcNetPayout(opened);
  const payout=res.payout;
  const profit=payout-betAmount;
  if(window.OuroBridge&&payout>0){
    window.OuroBridge.win(payout,'Treasure Boxes Cashout');
    balance=window.OuroBridge.getBalance();
  } else {
    balance+=payout;
  }
  updateBal();
  phase='idle';
  playCash();
  document.querySelectorAll('.box-item:not(.opened)').forEach((b,i)=>{
    const idx=+b.dataset.idx;
    b.classList.add('opened','locked');
    if(bombs.includes(idx)){b.classList.add('bomb');b.textContent='💣'}
    else{b.classList.add('gem');b.textContent='💎'}
  });
  document.getElementById('btnStart').disabled=false;
  document.getElementById('btnCash').disabled=true;
  document.getElementById('bombs').disabled=false;
  document.getElementById('cashHint').textContent='—';
  showToast('Cashed @ '+currentMult.toFixed(2)+'x'+(res.early?' (-5% fee)':'')+' · ₹'+fmt(payout),'win');
}

if(window.OuroBridge){
  balance=window.OuroBridge.init({
    gameId:'treasure',
    gameTitle:'Treasure Boxes',
    onBalanceChange:(bal)=>{balance=bal;updateBal();},
    onDenied:(msg)=>showToast(msg,'lose'),
  });
}
buildGrid();updateBal();
</script>
</body>
</html>
