<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tower Climb</title>
<script src="./ouro-wallet-bridge.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b12;--panel:#0f1520;--panel2:#161e2c;--border:rgba(255,255,255,0.07);--gold:#f0c14b;--green:#22c55e;--red:#ef4444;--text:#e8edf5;--muted:#7d8a9e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;user-select:none;overflow-x:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;background:linear-gradient(90deg,#f97316,#f0c14b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.bal-box{text-align:right}.bal-box .label{font-size:9px;color:var(--muted);text-transform:uppercase}
.bal-box .val{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--gold)}
.sound-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:14px;cursor:pointer}

.tower-wrap{margin:10px 12px;background:var(--panel);border-radius:16px;border:1px solid var(--border);padding:12px;max-height:340px;overflow-y:auto}
.floor{display:grid;grid-template-columns:40px 1fr 60px;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--border)}
.floor:last-child{border-bottom:none}
.floor-num{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{aspect-ratio:1.4;border-radius:8px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all 0.15s}
.tile:active{transform:scale(0.94)}
.tile.safe{background:linear-gradient(145deg,#166534,#14532d);border-color:#22c55e;color:#4ade80}
.tile.dead{background:linear-gradient(145deg,#7f1d1d,#450a0a);border-color:#ef4444}
.tile.locked{opacity:0.35;pointer-events:none}
.tile.current{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.floor-mult{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--gold);text-align:right}

.hud{display:flex;justify-content:space-between;padding:8px 14px;font-size:13px}
.hud span{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--gold)}

.controls{padding:12px 14px 16px;background:var(--panel);border-top:1px solid var(--border);margin-top:auto}
.row{display:flex;gap:10px;margin-bottom:10px}
.box{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.box label{font-size:10px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase}
.box input,.box select{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700}
.box select{color:var(--gold)}
.chips{display:flex;gap:6px;margin-bottom:12px}
.chip{flex:1;padding:8px 4px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted);text-align:center;cursor:pointer}
.chip.active{border-color:var(--gold);color:var(--gold)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:none;border-radius:14px;padding:15px 8px;font-size:15px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-start{background:linear-gradient(180deg,#f97316,#ea580c);color:#fff;box-shadow:0 4px 16px rgba(249,115,22,0.35)}
.btn-cash{background:linear-gradient(180deg,#22c55e,#15803d);color:#04120a;box-shadow:0 4px 16px rgba(34,197,94,0.35)}
.btn small{font-size:10px;font-weight:500;opacity:0.85}

.toast{position:fixed;top:58px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--panel2);border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:100;opacity:0;transition:all 0.28s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.win{border-color:#22c55e;color:#4ade80}
.toast.lose{border-color:#ef4444;color:#f87171}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">TOWER</div>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
    <div class="bal-box"><div class="label">Balance</div><div class="val" id="balance">₹0.00</div></div>
  </div>
</div>

<div class="hud">
  <div>Floor <span id="floorVal">0</span>/8</div>
  <div>Multiplier <span id="multVal">1.00x</span></div>
</div>

<div class="tower-wrap" id="tower"></div>

<div class="controls">
  <div class="row">
    <div class="box"><label>Bet Amount</label><input type="number" id="betAmt" value="100" min="10" step="10" oninput="if(phase==='idle')buildTower()"></div>
    <div class="box"><label>Difficulty</label>
      <select id="diff" onchange="if(phase==='idle')buildTower()">
        <option value="easy">Easy (1-2/3 traps)</option>
        <option value="medium" selected>Medium (2/3 traps)</option>
        <option value="hard">Hard (3/4 traps)</option>
      </select>
    </div>
  </div>
  <div class="chips">
    <div class="chip" onclick="setBet(50,this)">₹50</div>
    <div class="chip active" onclick="setBet(100,this)">₹100</div>
    <div class="chip" onclick="setBet(250,this)">₹250</div>
    <div class="chip" onclick="setBet(500,this)">₹500</div>
  </div>
  <div class="actions">
    <button class="btn btn-start" id="btnStart" onclick="startGame()">START<small id="startHint">Begin climb</small></button>
    <button class="btn btn-cash" id="btnCash" onclick="cashOut()" disabled>CASH OUT<small id="cashHint">—</small></button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const FLOORS=8;
const HIGH_FLOOR_START=5;
const HIGH_FLOOR_MIN_BET=50;
const TILES={easy:3,medium:3,hard:4};
const MULTS={
  easy:[1.36,2.04,3.07,4.60,6.90,18.50,48.00,110.00],
  medium:[2.70,8.10,24.30,72.00,215.00,580.00,1400.00,3200.00],
  hard:[3.60,14.40,56.00,220.00,820.00,2600.00,9500.00,45000.00]
};

let balance=window.OuroBridge?window.OuroBridge.getBalance():0,soundOn=true,phase='idle',floor=0,betAmount=0,currentMult=1;
let traps=[],audioCtx=null;

function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext);if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(f,d,t='sine',v=0.08,w=0){if(!soundOn)return;ensureAudio();const t0=audioCtx.currentTime+w;const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type=t;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(audioCtx.destination);o.start(t0);o.stop(t0+d+0.02)}
function playSafe(){tone(480,0.07,'sine',0.06);tone(720,0.08,'sine',0.04,0.05)}
function playTrap(){tone(100,0.2,'sawtooth',0.1);tone(60,0.3,'triangle',0.07,0.1)}
function playCash(){[523,659,784,1046].forEach((f,i)=>tone(f,0.13,'sine',0.08,i*0.07))}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').textContent=soundOn?'🔊':'🔇';if(soundOn)tone(600,0.07)}
function fmt(n){return n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function updateBal(){document.getElementById('balance').textContent='₹'+fmt(balance)}
function showToast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(type?' '+type:'');setTimeout(()=>t.classList.remove('show'),2000)}
function setBet(v,el){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));if(el)el.classList.add('active');document.getElementById('betAmt').value=v;if(phase==='idle')buildTower();}

function getFloorTrapCount(diff,f){
  if(diff==='easy')return f>=HIGH_FLOOR_START?2:1;
  if(diff==='medium')return 2;
  return 3;
}
function getExtraHazard(diff,f){
  if(f<HIGH_FLOOR_START)return 0;
  if(diff==='medium')return 0.16;
  if(diff==='hard')return 0.20;
  return 0;
}

function buildTower(){
  const diff=document.getElementById('diff').value;
  const mults=MULTS[diff];
  const tileCount=TILES[diff];
  const activeBet=phase==='playing'?betAmount:(+document.getElementById('betAmt').value||0);
  const highUnlocked=activeBet>=HIGH_FLOOR_MIN_BET;
  const box=document.getElementById('tower');
  box.innerHTML='';
  for(let i=FLOORS-1;i>=0;i--){
    const isHighLocked=i>=HIGH_FLOOR_START&&!highUnlocked;
    const row=document.createElement('div');
    row.className='floor';
    row.id='floor'+i;
    const multLabel=isHighLocked?('🔒 ₹50+'):(mults[i]>=100?mults[i].toFixed(0)+'x':mults[i].toFixed(2)+'x');
    row.innerHTML='<div class="floor-num">'+(i+1)+'</div><div class="tiles" id="tiles'+i+'" style="grid-template-columns:repeat('+tileCount+',1fr)"></div><div class="floor-mult">'+(multLabel)+'</div>';
    box.appendChild(row);
    const tiles=row.querySelector('.tiles');
    for(let t=0;t<tileCount;t++){
      const tile=document.createElement('div');
      tile.className='tile locked';
      tile.dataset.floor=i;
      tile.dataset.tile=t;
      if(isHighLocked)tile.textContent='🔒';
      tile.onclick=()=>pickTile(i,t);
      tiles.appendChild(tile);
    }
  }
  document.querySelectorAll('#tiles0 .tile').forEach(t=>t.classList.remove('locked'));
  document.querySelectorAll('#tiles0 .tile').forEach(t=>t.classList.add('current'));
}

function startGame(){
  if(phase==='playing')return;
  const amt=+document.getElementById('betAmt').value;
  if(!amt||amt<10)return showToast('Min bet ₹10');
  if(window.OuroBridge?!window.OuroBridge.canAfford(amt):amt>balance){
    showToast('Insufficient balance — Top Up','lose');
    if(window.OuroBridge)window.OuroBridge.openTopUp();
    return;
  }
  if(window.OuroBridge){
    if(!window.OuroBridge.bet(amt,'Tower Climb')){window.OuroBridge.openTopUp();return;}
    balance=window.OuroBridge.getBalance();
  } else {
    balance-=amt;
  }
  updateBal();
  betAmount=amt;floor=0;currentMult=1;phase='playing';

  const diff=document.getElementById('diff').value;
  const tileCount=TILES[diff];
  traps=[];
  for(let f=0;f<FLOORS;f++){
    const trapCount=getFloorTrapCount(diff,f);
    const arr=[];
    while(arr.length<trapCount){
      const r=Math.floor(Math.random()*tileCount);
      if(!arr.includes(r))arr.push(r);
    }
    traps.push(arr);
  }

  buildTower();
  document.getElementById('btnStart').disabled=true;
  document.getElementById('btnCash').disabled=true;
  document.getElementById('diff').disabled=true;
  document.getElementById('floorVal').textContent='0';
  document.getElementById('multVal').textContent='1.00x';
  document.getElementById('cashHint').textContent=amt<HIGH_FLOOR_MIN_BET?'Floors 1–5 unlocked':'—';
  tone(400,0.08,'square',0.05);
}

function pickTile(f,t){
  if(phase!=='playing'||f!==floor)return;
  if(f>=HIGH_FLOOR_START&&betAmount<HIGH_FLOOR_MIN_BET){
    showToast('Floors 6–8 require ₹50+ bet','lose');
    cashOut();
    return;
  }
  const diff=document.getElementById('diff').value;
  const tileCount=TILES[diff];
  const extraHit=!traps[f].includes(t)&&Math.random()<getExtraHazard(diff,f);
  const isTrap=traps[f].includes(t)||extraHit;

  for(let i=0;i<tileCount;i++){
    const el=document.querySelector('[data-floor="'+f+'"][data-tile="'+i+'"]');
    el.classList.remove('current','locked');
    if(traps[f].includes(i)||(extraHit&&i===t)){
      el.classList.add('dead');
      el.textContent='💀';
    } else {
      el.classList.add('safe');
      el.textContent='💎';
    }
  }

  if(isTrap){
    phase='dead';
    playTrap();
    document.getElementById('btnStart').disabled=false;
    document.getElementById('btnCash').disabled=true;
    document.getElementById('diff').disabled=false;
    document.getElementById('startHint').textContent='Begin climb';
    document.getElementById('cashHint').textContent='—';
    showToast('Trap! -₹'+fmt(betAmount),'lose');
    return;
  }

  floor++;
  currentMult=MULTS[diff][floor-1];
  document.getElementById('floorVal').textContent=floor;
  document.getElementById('multVal').textContent=currentMult.toFixed(2)+'x';
  document.getElementById('btnCash').disabled=false;
  document.getElementById('cashHint').textContent='₹'+fmt(betAmount*currentMult);
  playSafe();

  const maxAccessibleFloors=betAmount>=HIGH_FLOOR_MIN_BET?FLOORS:HIGH_FLOOR_START;
  if(floor>=maxAccessibleFloors){
    if(betAmount<HIGH_FLOOR_MIN_BET&&floor===HIGH_FLOOR_START){
      showToast('Max Floor 5 for <₹50 bet · Auto Cashed!','win');
    }
    cashOut();
    return;
  }
  document.querySelectorAll('#tiles'+floor+' .tile').forEach(el=>{
    el.classList.remove('locked');
    el.classList.add('current');
  });
}

function cashOut(){
  if(phase!=='playing'||floor===0)return;
  const payout=Math.round(betAmount*currentMult*100)/100;
  const profit=payout-betAmount;
  if(window.OuroBridge&&payout>0){
    window.OuroBridge.win(payout,'Tower Climb Cashout');
    balance=window.OuroBridge.getBalance();
  } else {
    balance+=payout;
  }
  updateBal();
  phase='idle';
  playCash();
  document.getElementById('btnStart').disabled=false;
  document.getElementById('btnCash').disabled=true;
  document.getElementById('diff').disabled=false;
  document.getElementById('startHint').textContent='Begin climb';
  document.getElementById('cashHint').textContent='—';
  showToast('Cashed @ '+currentMult.toFixed(2)+'x · +₹'+fmt(profit),'win');
  document.querySelectorAll('.tile.current').forEach(t=>{t.classList.remove('current');t.classList.add('locked')});
}

if(window.OuroBridge){
  balance=window.OuroBridge.init({
    gameId:'tower',
    gameTitle:'Tower Climb',
    onBalanceChange:(bal)=>{balance=bal;updateBal();},
    onDenied:(msg)=>showToast(msg,'lose'),
  });
}
buildTower();updateBal();
</script>
</body>
</html>
